<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour-Studio – GPX-Reiseführer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dde1e6; --text: #1d2228; --muted: #66707a;
    --blue: #1f6feb; --orange: #e8780c; --green: #1a7f37; --red: #cf222e; --amber: #9a6700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  header .tour { color: var(--muted); margin-right: auto; }
  button, .btn { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.danger { color: var(--red); }
  button:disabled { opacity: .5; cursor: default; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  input[type=number] { width: 64px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; }
  main { display: grid; grid-template-columns: 1fr 520px; min-height: 0; }
  #map { min-height: 0; background: #e9ecef; position: relative; }
  #map .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 20px; }
  aside { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 0; padding: 10px 14px; background: none; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }
  .tabpane { overflow: auto; padding: 10px 12px; min-height: 0; }
  .hidden { display: none !important; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #fff; }
  .card.off { background: #fafbfc; }
  .card.off .body { display: none; }
  .card .preview { display: none; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.off .preview { display: block; }
  .card.focus { outline: 2px solid var(--blue); }
  .card .head { display: flex; gap: 8px; align-items: center; }
  .card .head input[type=text] { flex: 1; font: inherit; font-weight: 600; border: 1px solid transparent; padding: 2px 4px; border-radius: 4px; }
  .card .head input[type=text]:hover, .card .head input[type=text]:focus { border-color: var(--line); }
  .badge { font-size: 12px; padding: 1px 7px; border-radius: 10px; background: #eef1f4; color: var(--muted); white-space: nowrap; }
  .badge.gpx { background: #ddeafd; color: var(--blue); }
  .badge.osm { background: #fde9d7; color: #a4520a; }
  .badge.wiki { background: #ece6fb; color: #6639ba; }
  .badge.manual { background: #e3f4e6; color: var(--green); }
  .meta { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
  .facts { font-size: 12.5px; color: #3d454d; margin: 4px 0; }
  textarea { width: 100%; min-height: 96px; font: inherit; font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .row button { padding: 3px 9px; font-size: 13px; }
  .row .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  a { color: var(--blue); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.conflict td { background: #fff1f0; }
  .warn { color: var(--red); font-weight: 600; }
  #pane-timeline tr[data-i] { cursor: pointer; }
  #pane-timeline tr[data-i]:hover td { background: #f3f6fb; }
  #pane-timeline tr.conflict:hover td { background: #ffe3e0; }
  #tip { position: fixed; z-index: 2000; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 13px; pointer-events: none; }
  #tip .meta, #tip .facts { margin: 3px 0; }
  #logbar { background: #11161c; color: #d7dde4; display: grid; grid-template-rows: auto 1fr; height: 230px; }
  #logbar.collapsed { height: 34px; }
  #logbar .top { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #262e38; }
  #logbar .top b { color: #fff; }
  #status { flex: 1; color: #9fb0c2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.busy::before { content: "● "; color: #f0b429; }
  .progress { width: 180px; height: 6px; background: #262e38; border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: #3fb950; transition: width .2s; }
  #logbar .top button { background: #1f2630; color: #d7dde4; border-color: #333d49; padding: 3px 10px; }
  #log { overflow: auto; padding: 6px 12px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; }
  #log .l-ok { color: #56d364; } #log .l-warn { color: #e3b341; } #log .l-err { color: #ff7b72; } #log .l-dim { color: #7d8b99; }
  #log .t { color: #6e7b88; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(760px, 92vw); }
  dialog textarea { min-height: 360px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .drop { position: fixed; inset: 0; background: rgba(31,111,235,.12); border: 3px dashed var(--blue); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--blue); z-index: 9999; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Tour-Studio</h1>
  <span class="tour" id="tourInfo">Keine Tour geladen</span>
  <label class="btn" for="fileInput">GPX öffnen</label>
  <input type="file" id="fileInput" accept=".gpx" class="hidden">
  <button id="btnSearch" class="primary" disabled>Sehenswürdigkeiten suchen</button>
  <label class="inline">Quelle
    <select id="source" title="Woher die Sehenswürdigkeiten kommen">
      <option value="both">OpenStreetMap + Wikipedia</option>
      <option value="auto">OpenStreetMap, Wikipedia nur als Ersatz</option>
      <option value="osm">nur OpenStreetMap</option>
      <option value="wiki">nur Wikipedia</option>
    </select>
  </label>
  <label class="inline">OSM über
    <select id="osmServer" title="Welche Server für OpenStreetMap gefragt werden">
      <option value="chain">Overpass, dann QLever</option>
      <option value="qlever">nur QLever</option>
      <option value="overpass">nur Overpass</option>
    </select>
  </label>
  <button id="btnCancel" class="hidden danger">Abbrechen</button>
  <label class="inline">Tempo <input type="number" id="speed" value="18" min="5" max="45"> km/h</label>
  <button id="btnClaude" disabled title="Liste als Text für den Chat mit Claude">Für Claude kopieren</button>
  <button id="btnExport" disabled>Reiseführer-GPX speichern</button>
</header>

<main>
  <div id="map"><div class="placeholder">GPX-Datei öffnen oder hierher ziehen.<br>Doppelklick auf die Karte setzt einen eigenen Punkt.</div></div>
  <aside>
    <div class="tabs">
      <button data-tab="list" class="active">Ansagen</button>
      <button data-tab="timeline">Zeitplan</button>
      <button data-tab="sections">Abschnitte</button>
    </div>
    <div class="tabpane" id="pane-list">
      <div class="toolbar" id="groupBar" title="Welche Arten von Sehenswürdigkeiten angezeigt und übernommen werden"></div>
      <div class="toolbar">
        <label class="inline"><input type="checkbox" id="onlyOn"> nur ausgewählte</label>
        <span id="listSummary"></span>
      </div>
      <div id="items"></div>
    </div>
    <div class="tabpane hidden" id="pane-timeline"></div>
    <div class="tabpane hidden" id="pane-sections"></div>
  </aside>
</main>

<section id="logbar">
  <div class="top">
    <b>Protokoll</b>
    <span id="status">Bereit</span>
    <div class="progress"><div id="progress"></div></div>
    <button id="btnLogCopy">Kopieren</button>
    <button id="btnLogClear">Leeren</button>
    <button id="btnLogToggle">Einklappen</button>
  </div>
  <div id="log"></div>
</section>

<div id="tip" class="hidden"></div>
<dialog id="dlg">
  <h3 id="dlgTitle" style="margin-top:0"></h3>
  <p id="dlgHint" style="color:var(--muted)"></p>
  <textarea id="dlgText"></textarea>
  <div class="row" style="justify-content:flex-end">
    <button id="dlgCopy" class="primary">In Zwischenablage kopieren</button>
    <button id="dlgClose">Schließen</button>
  </div>
</dialog>

<script>
'use strict';
/* ================================================================
   Geo- und GPX-Funktionen (gleiche Logik wie in der iPhone-App)
   ================================================================ */
const R_EARTH = 6371000;
function distance(a, b) {
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.latitude - a.latitude), dLon = toRad(b.longitude - a.longitude);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.latitude)) * Math.cos(toRad(b.latitude)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function simplifyRoute(points, minSpacing) {
  if (!points.length) return [];
  const out = [points[0]];
  for (const p of points) if (distance(out[out.length - 1], p) >= minSpacing) out.push(p);
  if (out[out.length - 1] !== points[points.length - 1]) out.push(points[points.length - 1]);
  return out;
}
function bbox(points, marginM) {
  let s = 90, w = 180, n = -90, e = -180;
  for (const p of points) { s = Math.min(s, p.latitude); n = Math.max(n, p.latitude); w = Math.min(w, p.longitude); e = Math.max(e, p.longitude); }
  const dLat = marginM / 111320, dLon = marginM / (111320 * Math.cos(((s + n) / 2) * Math.PI / 180));
  return [s - dLat, w - dLon, n + dLat, e + dLon].map((v) => Number(v.toFixed(5)));
}
// Projektion auf die Route: Abstand und Position (Meter ab Start)
function projectOnRoute(p, route, cum) {
  const kx = 111320 * Math.cos(p.latitude * Math.PI / 180), ky = 110540;
  let best = { d: Infinity, at: 0 };
  for (let i = 1; i < route.length; i++) {
    const ax = (route[i - 1].longitude - p.longitude) * kx, ay = (route[i - 1].latitude - p.latitude) * ky;
    const bx = (route[i].longitude - p.longitude) * kx, by = (route[i].latitude - p.latitude) * ky;
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best.d) best = { d, at: cum[i - 1] + t * (cum[i] - cum[i - 1]) };
  }
  return best;
}
// erster Routenpunkt, an dem der Auslöse-Radius erreicht wird
function triggerAt(p, radius, route, cum) {
  for (let i = 0; i < route.length; i++) if (distance(route[i], p) <= radius) return cum[i];
  return null;
}

function decodeXml(raw) {
  if (raw == null) return '';
  const cdata = raw.match(/<!\[CDATA\[([\s\S]*?)\]\]>/);
  let s = cdata ? cdata[1] : raw;
  if (!cdata) s = s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/&amp;/g, '&');
  return s.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, ' ').replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();
}
const childText = (xml, tag) => { const m = xml.match(new RegExp(`<(?:[\\w-]+:)?${tag}\\b[^>]*>([\\s\\S]*?)</(?:[\\w-]+:)?${tag}>`)); return m ? decodeXml(m[1]) : ''; };
const attr = (attrs, name) => { const m = attrs.match(new RegExp(`\\b${name}\\s*=\\s*["']([^"']*)["']`)); return m ? m[1].trim() : null; };
function coord(attrs) {
  const la = attr(attrs, 'lat'), lo = attr(attrs, 'lon');
  if (!la || !lo) return null;
  const latitude = +la, longitude = +lo;
  if (!isFinite(latitude) || !isFinite(longitude) || Math.abs(latitude) > 90 || Math.abs(longitude) > 180) return null;
  return { latitude, longitude };
}
function parseGpx(text, fileName) {
  if (!/<(?:[\w-]+:)?gpx\b/.test(text)) throw new Error('Das ist keine GPX-Datei.');
  if (!/<\/(?:[\w-]+:)?gpx>/.test(text)) throw new Error('Die GPX-Datei ist unvollständig.');
  const blocks = (tag) => [...text.matchAll(new RegExp(`<(?:[\\w-]+:)?${tag}\\b[^>]*>([\\s\\S]*?)</(?:[\\w-]+:)?${tag}>`, 'g'))].map((m) => m[1]);
  const pts = (block, tag) => [...block.matchAll(new RegExp(`<(?:[\\w-]+:)?${tag}\\b([^>]*?)/?>`, 'g'))].map((m) => coord(m[1])).filter(Boolean);
  const segments = [];
  for (const b of blocks('trkseg')) { const p = pts(b, 'trkpt'); if (p.length > 1) segments.push(p); }
  for (const b of blocks('rte')) { const p = pts(b, 'rtept'); if (p.length > 1) segments.push(p); }
  const waypoints = [];
  for (const m of text.matchAll(/<(?:[\w-]+:)?wpt\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:[\w-]+:)?wpt>)/g)) {
    const c = coord(m[1]); if (!c) continue;
    const inner = m[2] || '';
    waypoints.push({ name: childText(inner, 'name') || `Wegpunkt ${waypoints.length + 1}`, desc: childText(inner, 'desc') || childText(inner, 'cmt'), ...c });
  }
  if (!segments.length) throw new Error('Die Datei enthält keine Strecke (trk/rte).');
  const meta = text.match(/<(?:[\w-]+:)?metadata\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?metadata>/);
  const trk = text.match(/<(?:[\w-]+:)?trk\b[^>]*>([\s\S]*?)<\/(?:[\w-]+:)?trk>/);
  const name = (meta && childText(meta[1], 'name')) || (trk && childText(trk[1].replace(/<(?:[\w-]+:)?trkseg\b[\s\S]*/, ''), 'name')) || fileName.replace(/\.gpx$/i, '');
  return { name, segments, waypoints };
}

/* ================================================================
   Arten (gleiche Logik wie reisefuehrer/src/categories.js)
   ================================================================ */
const GROUPS = {
  geschichte: 'Geschichte',
  kirchen: 'Kirchen',
  technik: 'Technik',
  natur: 'Natur',
  tiere: 'Tiere',
  kurioses: 'Kunst & Kurioses',
  weitere: 'Weitere (ungeprüft)',
};

// Landschaften, die bei Wikidata oft nur als Ort/Ortsteil eingetragen sind (z. B. Campemoor)
const LANDSCAPE_WORDS = /moor|bruch|heide|niederung|naturschutz|naturpark|venn|marsch|düne/i;

const g = (label, corridor, group) => ({ label, corridor, group });

// OpenStreetMap-Tags → Art
function classify(t) {
  const h = t.historic, b = t.building;
  const hasWiki = !!(t.wikipedia || t.wikidata);
  // Geschichte
  if (h === 'castle') return g(t.castle_type === 'palace' || t.castle_type === 'manor' ? 'Schloss' : 'Burg', 1500, 'geschichte');
  if (h === 'palace' || h === 'manor') return g(h === 'palace' ? 'Schloss' : 'Herrenhaus', 600, 'geschichte');
  if (h === 'ruins') return g('Ruine', 600, 'geschichte');
  if (h === 'tower') return g('historischer Turm', 600, 'geschichte');
  if (h === 'city_gate') return g('Stadttor', 600, 'geschichte');
  if (h === 'fort') return g('Festung', 600, 'geschichte');
  if (h === 'monument') return g('Denkmal', 300, 'geschichte');
  if (h === 'archaeological_site') return g('Bodendenkmal', 300, 'geschichte');
  if (t.amenity === 'townhall') return g('historisches Rathaus', 300, 'geschichte');
  if (h === 'memorial') {
    if (/stolperstein|plaque|stele|grave/.test(t['memorial:type'] || t.memorial || '')) return { skip: 'Stolperstein/Gedenktafel' };
    return g('Gedenkstätte', 100, 'geschichte');
  }
  if (h === 'building') return g('historisches Gebäude', 100, 'geschichte');
  // Kirchen
  if (b === 'cathedral') return g('Dom', 1500, 'kirchen');
  if (h === 'monastery' || t.amenity === 'monastery') return g('Kloster', 600, 'kirchen');
  if (t.amenity === 'place_of_worship') {
    if (b === 'chapel' || t.place_of_worship === 'chapel') return g('Kapelle', 150, 'kirchen');
    if (b === 'church' || b === 'basilica') return g('Kirche', 600, 'kirchen');
    if (b === 'mosque') return g('Moschee', 600, 'kirchen');
    if (b === 'synagogue') return g('Synagoge', 300, 'kirchen');
    if (b && b !== 'yes') return null;
    return g(!t.religion || t.religion === 'christian' ? 'Kirche' : 'Gotteshaus', 300, 'kirchen');
  }
  // Technik
  if (h === 'windmill' || t.man_made === 'windmill') return g('Windmühle', 600, 'technik');
  if (h === 'watermill' || t.man_made === 'watermill') return g('Wassermühle', 300, 'technik');
  if (h === 'aircraft') return g('ausgestelltes Flugzeug', 300, 'technik');
  if (h === 'helicopter') return g('ausgestellter Hubschrauber', 300, 'technik');
  if (h === 'locomotive' || h === 'railway_car') return g('historische Bahn', 200, 'technik');
  if (h === 'ship' || h === 'wreck') return g('historisches Schiff', 300, 'technik');
  if (h === 'tank' || h === 'vehicle') return g('historisches Fahrzeug', 200, 'technik');
  if (t.aeroway === 'aerodrome') return g('Flugplatz', 1500, 'technik');
  if (t.lock === 'yes' || t.waterway === 'lock_gate') return g('Schleuse', 300, 'technik');
  if (t.bridge === 'aqueduct') return g('Kanalbrücke', 300, 'technik');
  if (t.man_made === 'water_tower') return g('Wasserturm', 600, 'technik');
  if (t.man_made === 'lighthouse') return g('Leuchtturm', 1500, 'technik');
  if (t.tourism === 'museum') return g('Museum', 300, 'geschichte');
  // Natur (Flächen nur mit Wikipedia-Artikel, sonst zu viel Unbedeutendes)
  if (t['tower:type'] === 'observation') return g('Aussichtsturm', 1500, 'natur');
  if (t.tourism === 'viewpoint') return g('Aussichtspunkt', 200, 'natur');
  if (t.leisure === 'bird_hide') return g('Vogelbeobachtung', 200, 'natur');
  if (t.natural === 'waterfall') return g('Wasserfall', 300, 'natur');
  if (t.natural === 'tree' && t.denotation === 'natural_monument') return g('Naturdenkmal', 100, 'natur');
  if (t.natural === 'stone') return g('Findling', 150, 'natur');
  if (hasWiki && t.natural === 'water') return g('See', 1500, 'natur');
  if (hasWiki && (t.natural === 'wetland' || t.wetland === 'bog')) return g('Moor', 1000, 'natur');
  if (hasWiki && (t.leisure === 'nature_reserve' || t.boundary === 'protected_area')) return g('Naturschutzgebiet', 1000, 'natur');
  // Tiere
  if (t.tourism === 'zoo') return g(t.zoo === 'petting_zoo' ? 'Streichelzoo' : t.zoo === 'wildlife_park' ? 'Wildpark' : 'Tierpark', 600, 'tiere');
  // Kunst & Kurioses
  if (t.tourism === 'artwork') return g('Kunstwerk', 100, 'kurioses');
  if (t.tourism === 'attraction') return g('Sehenswürdigkeit', 300, 'kurioses');
  return null;
}

// Overpass-Abfrage für ein Rechteck [s, w, n, e]
function overpassQuery([s, w, n, e]) {
  return `[out:json][timeout:60][bbox:${s},${w},${n},${e}];
(
nwr[historic~"^(castle|monastery|palace|manor|ruins|tower|city_gate|windmill|watermill|fort|monument|archaeological_site|memorial|building|mine|aircraft|helicopter|locomotive|railway_car|ship|wreck|tank|vehicle)$"];
nwr[amenity=place_of_worship][name];
nwr[building=cathedral][name];
nwr["tower:type"=observation];
nwr[man_made~"^(lighthouse|windmill|watermill|water_tower)$"];
nwr[tourism~"^(museum|viewpoint|attraction|zoo|artwork)$"];
nwr[amenity=townhall][name][historic];
nwr[amenity=townhall][name][heritage];
nwr[natural=waterfall];
nwr[aeroway=aerodrome][name];
nwr[lock=yes][name];
nwr[bridge=aqueduct][name];
nwr[leisure=bird_hide];
nwr[natural=tree][denotation=natural_monument];
nwr[natural=stone][name];
nwr[natural=water][name][~"^wiki(pedia|data)$"~"."];
nwr[natural=wetland][name][~"^wiki(pedia|data)$"~"."];
nwr[leisure=nature_reserve][name][~"^wiki(pedia|data)$"~"."];
);
out center tags;`;
}

// Für unbenannte Objekte (z. B. ausgestellter Hubschrauber ohne Namen) einen Namen bilden
function fallbackName(t, cls) {
  if (t.name) return t.name;
  const model = t.model || t['aircraft:model'] || t['aircraft:type'] || t.type_name || '';
  if (model) return `${cls.label}: ${model}`;

function setTour(text, fileName) {
  const t = parseGpx(text, fileName);
  state.tour = { name: t.name, fileName, raw: text, segments: t.segments };
  state.sections = null;
  state.items = t.waypoints.map((w, i) => ({ id: `gpx-${i}-${Date.now()}`, source: 'gpx', checked: true, name: w.name, label: '', latitude: w.latitude, longitude: w.longitude, desc: w.desc || '', wikiText: '', wikiUrl: '', facts: [] }));
  prepareRoute();
  recalc();
  log(`GPX geladen: „${t.name}“ – ${t.segments.reduce((n, s) => n + s.length, 0)} Streckenpunkte, ${fmtKm(cum[cum.length - 1])} km, ${t.waypoints.length} vorhandene Wegpunkte`, 'ok');
  render(true);
  save();
}
function prepareRoute() {
  route = state.tour ? state.tour.segments.flat() : [];
  cum = [0];
  for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + distance(route[i - 1], route[i]));
}
// Abstand, Position, Radius, Auslösepunkt für alle Einträge
function recalc() {
  for (const it of state.items) {
    const pr = projectOnRoute(it, route, cum);
    it.distanceToRoute = Math.round(pr.d);
    it.km = pr.at;
    it.radius = Math.max(150, it.distanceToRoute + 120);
    it.triggerKm = triggerAt(it, it.radius, route, cum);
  }
  state.items.sort((a, b) => (a.km ?? 0) - (b.km ?? 0));
}

   ================================================================ */
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function timedFetch(url, options, timeoutMs, waitingText) {
  const ctrl = new AbortController();
  const onAbort = () => ctrl.abort();
  job.controller.signal.addEventListener('abort', onAbort);
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = Date.now();
  job.waiting = { text: waitingText, since: t0 };
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    const body = await res.text();
    return { res, body, ms: Date.now() - t0 };
  } catch (e) {
    if (job.controller.signal.aborted) throw new Error('abgebrochen');
    if (ctrl.signal.aborted) throw new Error(`keine Antwort nach ${fmtS(timeoutMs)} (Zeitüberschreitung)`);
    throw new Error(`Netzwerkfehler: ${e.message}`);
  } finally {
    clearTimeout(timer);
    job.controller.signal.removeEventListener('abort', onAbort);
    job.waiting = null;
  }
}

async function overpass(query, label, rounds = 1) {
  let lastErr;
  // „Automatisch“: ein Durchgang, danach übernimmt Wikipedia.
  // „nur OpenStreetMap“: bis zu drei Durchgänge im Abstand von 20 s.
  for (let round = 1; round <= rounds; round++) {
    if (round > 1) {
      log(`${label}: alle Server fehlgeschlagen – Durchgang ${round}/${rounds} in 20 s …`, 'warn');
      job.waiting = { text: `Pause vor Durchgang ${round}/${rounds}`, since: Date.now() };
      await sleep(20000);
      job.waiting = null;
      if (job.controller.signal.aborted) throw new Error('abgebrochen');
    }
    for (const url of OVERPASS) {
      const host = new URL(url).host;
      log(`${label}: Anfrage an ${host} …`, 'dim');
      try {
        const { res, body, ms } = await timedFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(query) }, url === OVERPASS[0] ? 75000 : 30000, `wartet auf ${host} (${label})`);
        const kb = (body.length / 1024).toFixed(0);
        if (!res.ok) {
          const hint = res.status === 429 ? ' – zu viele Anfragen' : (res.status === 502 || res.status === 503 || res.status === 504) ? ' – Server gestört/überlastet' : '';
          throw new Error(`HTTP ${res.status} nach ${fmtS(ms)}${hint}`);
        }
        let json;
        try { json = JSON.parse(body); } catch (e) { throw new Error(`keine gültige Antwort (${kb} kB, ${fmtS(ms)})`); }
        if (json.remark && /error|timed out|out of memory/i.test(json.remark)) throw new Error(`Server meldet: ${json.remark.slice(0, 120)}`);
        log(`${label}: Antwort von ${host} – HTTP ${res.status}, ${fmtS(ms)}, ${kb} kB, ${json.elements.length} Objekte`, 'ok');
        json.__host = host;
        return json;
      } catch (e) {
        if (e.message === 'abgebrochen') throw e;
        lastErr = e;
        log(`${label}: ${host} fehlgeschlagen – ${e.message}`, 'warn');
      }
    }
  }
  throw new Error(`OpenStreetMap nicht erreichbar (${lastErr.message})`);
}

/* ---------------- QLever (OpenStreetMap als SPARQL, Uni Freiburg) ----------------
   Gleiche Auswahl wie die Overpass-Abfrage. Ergebnis wird in Overpass-Form
   ({type, id, lat, lon, tags}) umgebaut, damit die Auswertung identisch bleibt. */
const QLEVER = ['https://qlever.cs.uni-freiburg.de/api/osm-planet', 'https://qlever.dev/api/osm-planet'];
const QL_PATTERNS = [
  ['historic', 'castle monastery palace manor ruins tower city_gate windmill watermill fort monument archaeological_site memorial building mine aircraft helicopter locomotive railway_car ship wreck tank vehicle'],
  ['amenity', 'place_of_worship', 'name'],
  ['building', 'cathedral', 'name'],
  ['tower:type', 'observation'],
  ['man_made', 'lighthouse windmill watermill water_tower'],
  ['tourism', 'museum viewpoint attraction zoo artwork'],
  ['amenity', 'townhall', 'name historic'],
  ['amenity', 'townhall', 'name heritage'],
  ['natural', 'waterfall'],
  ['aeroway', 'aerodrome', 'name'],
  ['lock', 'yes', 'name'],
  ['bridge', 'aqueduct', 'name'],
  ['leisure', 'bird_hide'],
  ['natural', 'tree', 'denotation=natural_monument'],
  ['natural', 'stone', 'name'],
  ['natural', 'water', 'name wikidata'],
  ['natural', 'wetland', 'name wikidata'],
  ['leisure', 'nature_reserve', 'name wikidata'],
];
function qleverQuery([s, w, n, e], spatial) {
  let v = 0;
  const blocks = QL_PATTERNS.map(([key, values, extra = '']) => {
    const x = `?v${v++}`;
    const vals = values.split(' ');
    let b = vals.length === 1 ? `?osm osmkey:${key} "${vals[0]}" .` : `?osm osmkey:${key} ${x} . FILTER(${x} IN (${vals.map((t) => `"${t}"`).join(', ')}))`;
    for (const ex of extra.split(' ').filter(Boolean)) {
      const [k, val] = ex.split('=');
      b += val ? ` ?osm osmkey:${k} "${val}" .` : ` ?osm osmkey:${k} ?e${v++} .`;
    }
    return `{ ${b} }`;
  });
  const area = spatial === 'intersects'
    ? `FILTER(geof:sfIntersects(?c0, "POLYGON((${w} ${s}, ${e} ${s}, ${e} ${n}, ${w} ${n}, ${w} ${s}))"^^geo:wktLiteral))`
    : `BIND(geof:latitude(?c0) AS ?lat0) BIND(geof:longitude(?c0) AS ?lon0) FILTER(?lat0 >= ${s} && ?lat0 <= ${n} && ?lon0 >= ${w} && ?lon0 <= ${e})`;
  return `PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
PREFIX osmkey: <https://www.openstreetmap.org/wiki/Key:>
SELECT ?osm ?c ?k ?val WHERE {
  { SELECT DISTINCT ?osm ?c WHERE {
    ${blocks.join('\n    UNION ')}
    ?osm geo:hasCentroid/geo:asWKT ?c0 .
    ${area}
    BIND(?c0 AS ?c)
  } }
  ?osm ?k ?val .
  FILTER(STRSTARTS(STR(?k), "https://www.openstreetmap.org/wiki/Key:"))
}`;
}
function qleverToElements(json) {
  const byId = new Map();
  for (const b of json.results?.bindings || []) {
    const iri = b.osm?.value || '';
    const m = /openstreetmap\.org\/(node|way|relation)\/(\d+)/.exec(iri);
    if (!m) continue;
    let el = byId.get(iri);
    if (!el) {
      const pt = /POINT\s*\(\s*([-\d.eE]+)\s+([-\d.eE]+)\s*\)/.exec(b.c?.value || '');
      if (!pt) continue;
      el = { type: m[1], id: +m[2], lat: +pt[2], lon: +pt[1], tags: {} };
      byId.set(iri, el);
    }
    const key = decodeURIComponent((b.k?.value || '').replace('https://www.openstreetmap.org/wiki/Key:', ''));
    if (key && el.tags[key] == null) el.tags[key] = b.val?.value ?? '';
  }
  return [...byId.values()];
}
async function qlever(bb, label) {
  let lastErr;
  let variants = ['intersects', 'latlon'];
  try { if (localStorage.getItem('tour-studio-qlever-variant') === 'latlon') variants = ['latlon']; } catch (e) { /* egal */ }
  for (const url of QLEVER) {
    const host = new URL(url).host;
    for (const variant of variants) {
      log(`${label}: Anfrage an QLever (${host}${variant === 'latlon' ? ', Koordinatenfilter' : ''}) …`, 'dim');
      try {
        const { res, body, ms } = await timedFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/sparql-results+json' }, body: 'query=' + encodeURIComponent(qleverQuery(bb, variant)) }, 60000, `wartet auf QLever ${host} (${label})`);
        const kb = (body.length / 1024).toFixed(0);
        let json = null;
        try { json = JSON.parse(body); } catch (e) { /* unten */ }
        if (!res.ok || !json || json.exception) {
          const msg = json?.exception ? String(json.exception).slice(0, 160) : `HTTP ${res.status} nach ${fmtS(ms)}`;
          // Abfragefehler: andere Schreibweise versuchen; Serverfehler: nächster Server
          if (variant === 'intersects' && (res.status === 400 || json?.exception)) { log(`${label}: QLever versteht die Flächenabfrage nicht (${msg}) – versuche Koordinatenfilter`, 'warn'); lastErr = new Error(msg); continue; }
          throw new Error(msg);
        }
        const elements = qleverToElements(json);
        if (variant === 'latlon') { try { localStorage.setItem('tour-studio-qlever-variant', 'latlon'); } catch (e) { /* egal */ } }
        log(`${label}: Antwort von QLever ${host} – ${fmtS(ms)}, ${kb} kB, ${elements.length} Objekte`, 'ok');
        return { elements, __host: `QLever (${host})` };
      } catch (e) {
        if (e.message === 'abgebrochen') throw e;
        lastErr = e;
        log(`${label}: QLever ${host} fehlgeschlagen – ${e.message}`, 'warn');
        break;
      }
    }
  }
  throw new Error(`QLever nicht erreichbar (${lastErr?.message || 'unbekannt'})`);
}

async function wikiFor(item) {
  let title = null;
  const m = /^([a-z-]+):(.+)$/.exec(item.osm.wikipedia || '');
  if (m && m[1] === 'de') title = m[2];
  if (!title && item.osm.wikidata) {
    const q = item.osm.wikidata;
    const { res, body, ms } = await timedFetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(q)}&props=sitelinks|descriptions&sitefilter=dewiki&languages=de&format=json&origin=*`, {}, 20000, `wartet auf Wikidata (${item.name})`);
    if (!res.ok) throw new Error(`Wikidata HTTP ${res.status}`);
    const ent = JSON.parse(body).entities?.[q];
    title = ent?.sitelinks?.dewiki?.title || null;
    const wd = ent?.descriptions?.de?.value;
    if (wd) item.facts.push(`Wikidata: ${wd}`);
    if (!title) { log(`  ${item.name}: kein deutscher Wikipedia-Artikel (Wikidata ${q}, ${fmtS(ms)})`, 'dim'); return; }
  }
  if (!title) return;
  const { res, body, ms } = await timedFetch(`https://de.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, '_'))}`, {}, 20000, `wartet auf Wikipedia (${item.name})`);
  if (!res.ok) { log(`  ${item.name}: Wikipedia HTTP ${res.status} für „${title}“`, 'warn'); return; }
  const data = JSON.parse(body);
  item.wikiText = data.extract || '';
  item.wikiUrl = data.content_urls?.desktop?.page || `https://de.wikipedia.org/wiki/${encodeURIComponent(title)}`;
  if (!item.desc && item.wikiText) item.desc = item.wikiText;
  log(`  ${item.name}: Wikipedia „${title}“ – ${item.wikiText.length} Zeichen (${fmtS(ms)})`, 'ok');
}

/* ----------------------------------------------------------------
   Abschnitte: jeder ~6-km-Teil der Route wird einzeln geladen,
   gespeichert und kann einzeln wiederholt werden.
   ---------------------------------------------------------------- */
const SECTION_LABEL = { ok: 'geladen', cache: 'aus Zwischenspeicher', wiki: 'Ersatz: Wikipedia', failed: 'fehlgeschlagen', pending: 'offen' };
const SECTION_COLOR = { ok: '#1a7f37', cache: '#1f6feb', wiki: '#8250df', failed: '#cf222e', pending: '#9aa4ae' };
function buildSections() {
  const simple = simplifyRoute(route, 150);
  const idx = new Map(route.map((p, i) => [p, i]));
  const kmOf = (p) => cum[idx.get(p)] ?? projectOnRoute(p, route, cum).at;
  const CHUNK = 40, out = [];
  for (let i = 0; i < simple.length - 1; i += CHUNK - 1) {
    const pts = simple.slice(i, i + CHUNK);
    out.push({ pts, startM: kmOf(pts[0]), endM: kmOf(pts[pts.length - 1]) });
  }
  return out;
}
function sectionRoute(sec) {
  return route.filter((p, i) => cum[i] >= sec.startM - 1 && cum[i] <= sec.endM + 1);
}

// Zwischenspeicher für OpenStreetMap-Antworten (7 Tage)
const CACHE_PREFIX = 'ts-op:', CACHE_DAYS = 7;
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function cacheGet(query) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + hashStr(query));
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (Date.now() - c.t > CACHE_DAYS * 864e5) return null;
    return c;
  } catch (e) { return null; }
}
function cachePut(query, elements) {
  const key = CACHE_PREFIX + hashStr(query), val = JSON.stringify({ t: Date.now(), elements });
  for (let attempt = 0; attempt < 2; attempt++) {
    try { localStorage.setItem(key, val); return; } catch (e) {
      // Speicher voll: älteste Einträge entfernen
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(CACHE_PREFIX))
        .map((k) => { try { return [k, JSON.parse(localStorage.getItem(k)).t]; } catch (x) { return [k, 0]; } })
        .sort((a, b) => a[1] - b[1]);
      keys.slice(0, Math.max(1, Math.ceil(keys.length / 2))).forEach(([k]) => localStorage.removeItem(k));
    }
  }
}
function cacheClear() {
  try { Object.keys(localStorage).filter((k) => k.startsWith(CACHE_PREFIX)).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* egal */ }
}

// OpenStreetMap-Objekte eines Abschnitts in Einträge umwandeln
function parseElements(elements, secIndex, stats, taken) {
  const out = [];
  for (const el of elements) {
    const t = el.tags || {};
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    if (lat == null) { stats.noName++; continue; }
    const key = `${el.type}/${el.id}`;
    if (taken.has(`osm-${key}`)) continue;
    const cls = classify(t);
    if (!cls) { stats.noCat++; continue; }
    if (cls.skip) { stats.skipped++; continue; }
    const name = fallbackName(t, cls);
    if (!name) { stats.noName++; continue; }
    const pos = { latitude: lat, longitude: lon };
    const pr = projectOnRoute(pos, route, cum);
    if (pr.d > cls.corridor) { stats.far++; continue; }
    if (state.items.some((it) => it.source !== 'osm' && it.source !== 'wiki' && distance(it, pos) < 120)) { stats.own++; continue; }
    const dup = out.find((o) => o.name === name && distance(o, pos) < 150);
    if (dup) { if (!dup.osm.wikipedia && t.wikipedia) dup.osm.wikipedia = t.wikipedia; if (!dup.osm.wikidata && t.wikidata) dup.osm.wikidata = t.wikidata; stats.dup++; continue; }
    taken.add(`osm-${key}`);
    out.push({ id: `osm-${key}`, section: secIndex, source: 'osm', checked: false, name, label: cls.label, group: cls.group, latitude: lat, longitude: lon, desc: '', wikiText: '', wikiUrl: '', facts: osmFacts(t), osm: { wikipedia: t.wikipedia || '', wikidata: t.wikidata || '', link: `https://www.openstreetmap.org/${el.type}/${el.id}` } });
  }
  return out;
}

// targets: null = alle Abschnitte neu; sonst Liste von Abschnittsnummern
async function search(targets = null) {
  if (!state.tour || job) return;
  job = { controller: new AbortController(), start: Date.now(), waiting: null };
  $('btnSearch').disabled = true;
  $('btnCancel').classList.remove('hidden');
  const ticker = setInterval(() => {
    if (!job) return;
    const w = job.waiting ? ` – ${job.waiting.text}, seit ${fmtS(Date.now() - job.waiting.since)}` : '';
    setStatus(`${job.step || 'läuft'} · gesamt ${fmtS(Date.now() - job.start)}${w}`, true);
  }, 250);
  try {
    const secs = buildSections();
    const full = !targets || !state.sections || state.sections.length !== secs.length;
    if (full) {
      state.sections = secs.map((s) => ({ startM: s.startM, endM: s.endM, status: 'pending', source: '', count: 0, error: '' }));
      targets = secs.map((_, i) => i);
    }
    const sourceMode = $('source').value, osmServer = $('osmServer').value;
    const MODE_TEXT = { both: 'OpenStreetMap + Wikipedia', auto: 'OpenStreetMap, Wikipedia als Ersatz', osm: 'nur OpenStreetMap', wiki: 'nur Wikipedia' };
    const SERVER_TEXT = { chain: 'Overpass, dann QLever', qlever: 'nur QLever', overpass: 'nur Overpass' };
    log(`${full ? 'Suche gestartet' : 'Erneuter Versuch'}: ${targets.length} von ${secs.length} Abschnitt(en), Quelle ${MODE_TEXT[sourceMode]}${sourceMode !== 'wiki' ? `, OSM über ${SERVER_TEXT[osmServer]}` : ''}`, 'ok');

    // bisherige Funde der betroffenen Abschnitte entfernen (eigene/zusammengefasste bleiben)
    const tset = new Set(targets);
    state.items = state.items.filter((it) => !((it.source === 'osm' || it.source === 'wiki') && (full || tset.has(it.section))));
    const taken = new Set(state.items.map((it) => it.id));
    const stats = { far: 0, noCat: 0, skipped: 0, own: 0, dup: 0, noName: 0 };
    const newItems = [];
    for (const i of targets) { const sec = state.sections[i]; sec.wiki = null; if (sourceMode === 'wiki') { sec.status = 'pending'; sec.count = 0; } }
    renderSections(); drawMap();

    // 1) OpenStreetMap je Abschnitt (Zwischenspeicher zuerst, dann Overpass, dann QLever)
    for (let n = 0; n < targets.length && sourceMode !== 'wiki'; n++) {
      const i = targets[n], sec = state.sections[i], label = `Abschnitt ${i + 1}/${secs.length} (km ${fmtKm(sec.startM)}–${fmtKm(sec.endM)})`;
      job.step = `OpenStreetMap: ${label}`;
      setStatus(job.step, true, (n / targets.length) * 0.5);
      const query = buildQuery(secs[i].pts);
      let elements = null;
      const cached = cacheGet(query);
      if (cached) {
        elements = cached.elements; sec.status = 'cache'; sec.source = 'Zwischenspeicher';
        log(`${label}: aus Zwischenspeicher (geladen ${new Date(cached.t).toLocaleString('de-DE')}), ${elements.length} Objekte`, 'ok');
      } else {
        const errors = [];
        if (osmServer !== 'qlever') {
          try {
            const json = await overpass(query, label, sourceMode === 'osm' && osmServer === 'overpass' ? 3 : 1);
            elements = json.elements; sec.source = json.__host || 'Overpass';
          } catch (e) { if (e.message === 'abgebrochen') throw e; errors.push(e.message); }
        }
        if (!elements && osmServer !== 'overpass') {
          try {
            const json = await qlever(bbox(secs[i].pts, 1600), label);
            elements = json.elements; sec.source = json.__host;
          } catch (e) { if (e.message === 'abgebrochen') throw e; errors.push(e.message); }
        }
        if (elements) { cachePut(query, elements); sec.status = 'ok'; }
        else {
          sec.status = 'failed'; sec.error = errors.join(' · '); sec.count = 0;
          log(`${label}: fehlgeschlagen – ${sec.error}`, 'warn');
        }
      }
      if (elements) {
        const list = parseElements(elements, i, stats, taken);
        sec.count = list.length; sec.error = '';
        newItems.push(...list);
        log(`${label}: ${list.length} Sehenswürdigkeiten in Reichweite`, list.length ? 'ok' : '');
      }
      renderSections(); drawMap();
    }
    if (sourceMode !== 'wiki') log(`Aussortiert: ${stats.far} zu weit von der Strecke, ${stats.noCat} keine passende Art, ${stats.skipped} Stolpersteine/Gedenktafeln, ${stats.own} schon als eigener Wegpunkt, ${stats.dup} doppelt eingetragen, ${stats.noName} ohne Namen`, 'dim');

    // 2) Wikipedia-Texte für neue OpenStreetMap-Funde
    const withWiki = newItems.filter((p) => p.source === 'osm' && (p.osm.wikipedia || p.osm.wikidata));
    if (withWiki.length) log(`Lade Texte für ${withWiki.length} Funde mit Wikipedia-/Wikidata-Verweis …`, 'ok');
    let done = 0;
    const queue = [...withWiki];
    const worker = async () => {
      while (queue.length) {
        const p = queue.shift();
        try { await wikiFor(p); } catch (e) { if (e.message === 'abgebrochen') throw e; log(`  ${p.name}: ${e.message}`, 'warn'); }
        done++;
        job.step = `Wikipedia-Texte: ${done}/${withWiki.length}`;
        setStatus(job.step, true, 0.5 + 0.15 * (done / Math.max(1, withWiki.length)));
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    for (const p of newItems) if (p.source === 'osm') p.checked = !!p.wikiText;

    // 3) Wikipedia-Umkreissuche: bei „kombiniert“ und „nur Wikipedia“ für alle Abschnitte,
    //    bei „Ersatz“ nur für Abschnitte ohne OpenStreetMap-Daten
    const wikiTargets = sourceMode === 'osm' ? [] : sourceMode === 'auto' ? targets.filter((i) => state.sections[i].status === 'failed') : targets;
    if (wikiTargets.length) {
      log(sourceMode === 'auto' ? `${wikiTargets.length} Abschnitt(e) ohne OpenStreetMap-Daten – Ersatz über Wikipedia` : `Wikipedia-Umkreissuche für ${wikiTargets.length} Abschnitt(e) …`, sourceMode === 'auto' ? 'warn' : 'ok');
      const own = state.items.filter((it) => it.source !== 'osm' && it.source !== 'wiki');
      const osmAll = state.items.filter((it) => it.source === 'osm').concat(newItems.filter((p) => p.source === 'osm'));
      const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, '');
      const wikiOf = (url) => decodeURIComponent(String(url || '').split('/wiki/')[1] || '').replace(/_/g, ' ');
      for (let n = 0; n < wikiTargets.length; n++) {
        const i = wikiTargets[n], sec = state.sections[i];
        job.step = `Wikipedia: Abschnitt ${i + 1}`;
        setStatus(job.step, true, 0.65 + 0.35 * (n / wikiTargets.length));
        try {
          const sights = await wikiSights(sectionRoute(sec), own, getJsonLogged, (t) => log(t, 'dim'));
          let added = 0, merged = 0;
          for (const p of sights) {
            if (taken.has(p.id)) continue;
            // derselbe Ort schon aus OpenStreetMap? → zusammenführen statt doppelt
            const twin = osmAll.find((o) => (p.qid && o.osm.wikidata === p.qid)
              || (o.wikiUrl && wikiOf(o.wikiUrl) === p.wikiTitle)
              || (/^de:/.test(o.osm.wikipedia) && o.osm.wikipedia.slice(3) === p.wikiTitle)
              || (norm(o.name) === norm(p.name) && distance(o, p) < 250));
            taken.add(p.id);
            if (twin) {
              merged++;
              if (!twin.wikiText && p.desc) {
                twin.wikiText = p.desc; if (!twin.desc) twin.desc = p.desc;
                twin.wikiUrl = `https://de.wikipedia.org/wiki/${encodeURIComponent(p.wikiTitle.replace(/ /g, '_'))}`;
                twin.checked = true;
                if (p.wdDescription && !twin.facts.some((f) => f.includes(p.wdDescription))) twin.facts.push(`Wikidata: ${p.wdDescription}`);
                log(`  „${twin.name}“ (OSM) mit Wikipedia „${p.wikiTitle}“ ergänzt`, 'dim');
              }
              continue;
            }
            if (newItems.some((o) => o.source === 'wiki' && norm(o.name) === norm(p.name) && distance(o, p) < 250)) continue;
            added++;
            newItems.push({ id: p.id, section: i, source: 'wiki', checked: !!p.desc && p.group !== 'weitere', name: p.name, label: p.label, group: p.group, latitude: p.latitude, longitude: p.longitude,
              desc: p.desc, wikiText: p.desc, wikiUrl: `https://de.wikipedia.org/wiki/${encodeURIComponent(p.wikiTitle.replace(/ /g, '_'))}`, facts: p.wdDescription ? [`Wikidata: ${p.wdDescription}`] : [], qid: p.qid || '' });
          }
          sec.wiki = { status: 'ok', count: added, merged };
          if (sourceMode === 'auto' || sourceMode === 'wiki') { sec.status = 'wiki'; sec.source = 'Wikipedia'; sec.count = added; }
          log(`Abschnitt ${i + 1}: Wikipedia ${added} zusätzliche Funde${merged ? `, ${merged} schon aus OpenStreetMap bekannt` : ''}`, 'ok');
        } catch (e) {
          if (e.message === 'abgebrochen') throw e;
          sec.wiki = { status: 'failed', count: 0, error: e.message };
          if (sourceMode === 'wiki') sec.status = 'failed';
          log(`Abschnitt ${i + 1}: Wikipedia fehlgeschlagen – ${e.message}`, 'err');
        }
        renderSections(); drawMap();
      }
    }

    // 4) gleicher Wikipedia-Artikel = gleicher Ort: nur einen behalten (OSM vor Wikipedia, sonst der nähere)
    const all = state.items.filter((it) => it.source === 'osm' || it.source === 'wiki').concat(newItems);
    const keep = new Set(all);
    const byArticle = new Map();
    const rank = (p) => (p.source === 'osm' ? 0 : 1e6) + projectOnRoute(p, route, cum).d;
    for (const p of [...all].sort((a, b) => rank(a) - rank(b))) {
      if (!p.wikiUrl) continue;
      const first = byArticle.get(p.wikiUrl);
      if (first) { keep.delete(p); log(`Doppelt: „${p.name}“ beschreibt dasselbe wie „${first.name}“ – entfernt`, 'dim'); }
      else byArticle.set(p.wikiUrl, p);
    }
    state.items = state.items.filter((it) => !(it.source === 'osm' || it.source === 'wiki') || keep.has(it)).concat(newItems.filter((p) => keep.has(p)));
    recalc(); render(!targets || full); save();
    const open = state.sections.filter(sectionOpen).length;
    log(`Fertig nach ${fmtS(Date.now() - job.start)}: ${newItems.filter((p) => keep.has(p)).length} neue Funde${open ? ` · ${open} Abschnitt(e) unvollständig – siehe Reiter „Abschnitte“` : ''}`, open ? 'warn' : 'ok');
    setStatus(`Fertig${open ? ` – ${open} Abschnitt(e) unvollständig` : ''}`, false, 1);
  } catch (e) {
    log(`Suche beendet: ${e.message}`, e.message === 'abgebrochen' ? 'warn' : 'err');
    setStatus(`Fehler: ${e.message}`, false);
    recalc(); render(); save();
  } finally {
    clearInterval(ticker);
    job = null;
    $('btnSearch').disabled = !state.tour;
    $('btnCancel').classList.add('hidden');
    renderSections();
  }
}

function sectionOpen(s) {
  const mode = $('source')?.value;
  return s.status === 'failed' || s.status === 'pending' || (s.status === 'wiki' && mode !== 'wiki') || s.wiki?.status === 'failed';
}
function renderSections() {
  const pane = $('pane-sections');
  if (!pane) return;
  if (!state.tour || !state.sections) { pane.innerHTML = '<p class="meta">Noch keine Suche gelaufen.</p>'; return; }
  const open = state.sections.map((s, i) => [s, i]).filter(([s]) => sectionOpen(s));
  pane.innerHTML = `
    <p class="meta">Die Route wird in Abschnitten von etwa 6 km abgefragt. Geladene Abschnitte bleiben 7 Tage im Zwischenspeicher.
    Ein erneuter Versuch lohnt sich bei <b style="color:${SECTION_COLOR.failed}">fehlgeschlagen</b> und <b style="color:${SECTION_COLOR.wiki}">Ersatz: Wikipedia</b> (OpenStreetMap findet meist mehr) sowie bei fehlgeschlagener Wikipedia-Suche.
    Die Spalte „Wikipedia“ zeigt zusätzliche Funde; Orte, die OpenStreetMap schon kennt, werden zusammengeführt statt doppelt aufgeführt.</p>
    <div class="row">${open.length ? `<button id="btnRetryAll" class="primary">Alle unvollständigen erneut laden (${open.length})</button>` : '<span style="color:var(--green)">Alle Abschnitte vollständig geladen.</span>'}
      <button id="btnCacheClear" title="gespeicherte OpenStreetMap-Antworten löschen">Zwischenspeicher leeren</button></div>
    <table style="margin-top:8px"><thead><tr><th>#</th><th>km</th><th>OpenStreetMap</th><th>Funde</th><th>Wikipedia</th><th></th></tr></thead><tbody>
    ${state.sections.map((s, i) => `<tr data-s="${i}"><td>${i + 1}</td><td>${fmtKm(s.startM)}–${fmtKm(s.endM)}</td>
      <td><span style="color:${SECTION_COLOR[s.status]};font-weight:600">● ${SECTION_LABEL[s.status]}</span>${s.error && s.status !== 'ok' && s.status !== 'cache' ? `<div class="meta">${escapeHtml(s.error)}</div>` : ''}</td>
      <td>${s.status === 'pending' ? '–' : s.count}${s.source && (s.status === 'ok') ? `<div class="meta">${escapeHtml(s.source)}</div>` : ''}</td>
      <td>${!s.wiki ? '–' : s.wiki.status === 'failed' ? `<span style="color:${SECTION_COLOR.failed};font-weight:600" title="${escapeHtml(s.wiki.error || '')}">fehlgeschlagen</span>` : `+${s.wiki.count}${s.wiki.merged ? ` <span class="meta">(${s.wiki.merged} zusammengeführt)</span>` : ''}`}</td>
      <td>${sectionOpen(s) ? '<button data-retry>Erneut laden</button>' : ''}</td></tr>`).join('')}
    </tbody></table>`;
  $('btnRetryAll')?.addEventListener('click', () => search(open.map(([, i]) => i)));
  $('btnCacheClear').addEventListener('click', () => { cacheClear(); log('Zwischenspeicher geleert', 'ok'); });
  pane.querySelectorAll('tr[data-s]').forEach((tr) => {
    const i = +tr.dataset.s;
    tr.querySelector('[data-retry]')?.addEventListener('click', (e) => { e.stopPropagation(); search([i]); });
    tr.addEventListener('click', () => { const sec = state.sections[i]; const pts = sectionRoute(sec); if (map && pts.length) map.fitBounds(pts.map((p) => [p.latitude, p.longitude]), { padding: [30, 30] }); });
  });
}

/* ================================================================
   Ersatzquelle Wikipedia (gleiche Logik wie reisefuehrer/src/wikisights.js)
   ================================================================ */
const distanceToRoute = (p, r) => projectOnRoute(p, r, cumFor(r)).d;
function cumFor(r) { const c = [0]; for (let i = 1; i < r.length; i++) c.push(c[i - 1] + distance(r[i - 1], r[i])); return c; }
const WIKI = 'https://de.wikipedia.org/w/api.php';
const WD = 'https://www.wikidata.org/w/api.php';

function cleanTitle(title) {
  return title.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

function chunked(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

async function pool(items, n, fn) {
  const queue = [...items];
  await Promise.all(Array.from({ length: n }, async () => {
    while (queue.length) await fn(queue.shift());
  }));
}

// Kategorie über P31 (ist ein) und bis zu zwei Ebenen P279 (Unterklasse von)
async function classifyAll(qids, getJson) {
  const p31 = {};
  for (const batch of chunked(qids, 50)) {
    const data = await getJson(`${WD}?action=wbgetentities&ids=${batch.join('|')}&props=claims|descriptions&languages=de&format=json&origin=*`, 'Wikidata');
    for (const [id, ent] of Object.entries(data.entities || {})) {
      const claims = ent.claims?.P31 || [];
      p31[id] = {
        classes: claims.map((c) => c.mainsnak?.datavalue?.value?.id).filter(Boolean),
        description: ent.descriptions?.de?.value || '',
      };
    }
  }
  const parents = {}; // Klasse → Oberklassen
  let unknown = new Set(Object.values(p31).flatMap((e) => e.classes).filter((c) => !WD_CLASSES[c]));
  for (let level = 0; level < 2 && unknown.size; level++) {
    const next = new Set();
    for (const batch of chunked([...unknown], 50)) {
      const data = await getJson(`${WD}?action=wbgetentities&ids=${batch.join('|')}&props=claims&format=json&origin=*`, 'Wikidata-Klassen');
      for (const [id, ent] of Object.entries(data.entities || {})) {
        parents[id] = (ent.claims?.P279 || []).map((c) => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
        for (const p of parents[id]) if (!WD_CLASSES[p] && !parents[p]) next.add(p);
      }
    }
    unknown = next;
  }
  const resolve = (cls, depth = 0) => {
    if (WD_CLASSES[cls]) return WD_CLASSES[cls];
    if (depth >= 2) return null;
    for (const p of parents[cls] || []) {
      const r = resolve(p, depth + 1);
      if (r) return r;
    }
    return null;
  };
  const result = {};
  for (const [id, e] of Object.entries(p31)) {
    let best = null;
    for (const c of e.classes) {
      const r = resolve(c);
      if (r && (!best || r[1] > best[1])) best = r;
    }
    result[id] = { cls: best, description: e.description };
  }
  return result;
}

// route: alle Streckenpunkte; exclude: eigene Wegpunkte; log(text, level)
async function wikiSights(route, exclude, getJson, log = () => {}) {
  // Suchkreise (Radius 1,6 km) alle 1,2 km decken einen 1,5-km-Streifen ab
  const centers = simplifyRoute(route, 1200);
  log(`Wikipedia-Umkreissuche an ${centers.length} Punkten entlang der Route …`);
  const pages = new Map();
  await pool(centers, 4, async (c) => {
    const data = await getJson(`${WIKI}?action=query&list=geosearch&gscoord=${c.latitude.toFixed(5)}|${c.longitude.toFixed(5)}&gsradius=1600&gslimit=100&format=json&origin=*`, 'Wikipedia-Umkreis');
    for (const g of data.query?.geosearch || []) {
      if (!pages.has(g.pageid)) pages.set(g.pageid, { pageid: g.pageid, title: g.title, latitude: g.lat, longitude: g.lon });
    }
  });
  const stats = { far: 0, own: 0, noCat: 0, noWd: 0 };
  let cands = [...pages.values()];
  for (const p of cands) p.d = distanceToRoute(p, route);
  cands = cands.filter((p) => (p.d <= 1500 ? true : (stats.far++, false)));
  log(`${pages.size} Wikipedia-Artikel im Umkreis, ${cands.length} nah genug an der Strecke`);

  // Wikidata-Kennung je Artikel
  for (const batch of chunked(cands, 50)) {
    const data = await getJson(`${WIKI}?action=query&prop=pageprops&ppprop=wikibase_item&pageids=${batch.map((p) => p.pageid).join('|')}&format=json&origin=*`, 'Wikipedia-Seiten');
    for (const pg of Object.values(data.query?.pages || {})) {
      const p = cands.find((x) => x.pageid === pg.pageid);
      if (p) p.qid = pg.pageprops?.wikibase_item || null;
    }
  }
  const withQ = cands.filter((p) => (p.qid ? true : (stats.noWd++, false)));
  const classes = await classifyAll([...new Set(withQ.map((p) => p.qid))], getJson);

  const kept = [];
  for (const p of withQ) {
    const c = classes[p.qid] || { cls: null, description: '' };
    let cls = c.cls;
    if (!cls && LANDSCAPE_WORDS.test(`${p.title} ${c.description}`)) cls = ['Landschaft', 1500, 'natur'];
    // nicht einzuordnen: nicht verwerfen, sondern als „weitere (ungeprüft)“ zur Auswahl stellen
    if (!cls) { stats.noCat++; cls = ['weiterer Ort', 1500, 'weitere']; }
    const [label, corridor, group] = cls;
    if (p.d > corridor) { stats.far++; continue; }
    if (exclude.some((w) => distance(w, p) < 120)) { stats.own++; continue; }
    kept.push({ ...p, label, corridor, group, wdDescription: c.description });
  }

  // Einleitungstexte (20 je Abfrage)
  for (const batch of chunked(kept, 20)) {
    const data = await getJson(`${WIKI}?action=query&prop=extracts&exintro=1&explaintext=1&exlimit=20&pageids=${batch.map((p) => p.pageid).join('|')}&format=json&origin=*`, 'Wikipedia-Texte');
    for (const pg of Object.values(data.query?.pages || {})) {
      const p = kept.find((x) => x.pageid === pg.pageid);
      if (p) p.extract = (pg.extract || '').trim();
    }
  }
  log(`Wikipedia: ${kept.length} Sehenswürdigkeiten · aussortiert: ${stats.far} zu weit weg, ${stats.noCat} nicht eingeordnet (unter „Weitere“), ${stats.noWd} ohne Wikidata, ${stats.own} schon eigener Wegpunkt`);

  return kept.map((p) => ({
    id: `wiki-${p.pageid}`,
    name: cleanTitle(p.title),
    label: p.label,
    group: p.group,
    latitude: p.latitude,
    longitude: p.longitude,
    distanceToRoute: Math.round(p.d),
    radius: Math.round(Math.max(150, p.d + 120)),
    desc: p.extract || '',
    wikiTitle: p.title,
    wdDescription: p.wdDescription,
    qid: p.qid,
    source: 'wikipedia',
  }));
}

   Karte
   ================================================================ */
let map = null, routeLayer = null, markerLayer = null, focusCircle = null;
const markers = new Map();
function initMap() {
  if (typeof L === 'undefined') { $('map').querySelector('.placeholder').innerHTML = 'Karte nicht verfügbar (keine Internetverbindung zu unpkg.com).<br>Alles andere funktioniert trotzdem.'; return; }
  $('map').innerHTML = '';
  map = L.map('map', { doubleClickZoom: false }).setView([51.2, 10.4], 6);
  // Hinweis: tile.openstreetmap.org sperrt Seiten, die als lokale Datei geöffnet werden (kein Referer).
  const osmAttr = 'Daten © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende';
  const layers = {
    'Fahrradkarte (CyclOSM)': L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', { maxZoom: 20, subdomains: 'abc', attribution: `${osmAttr} · Stil <a href="https://www.cyclosm.org">CyclOSM</a>` }),
    'Topografisch (OpenTopoMap)': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, subdomains: 'abc', attribution: `${osmAttr} · Stil © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)` }),
  };
  let chosen = 'Fahrradkarte (CyclOSM)';
  try { chosen = localStorage.getItem('tour-studio-layer') || chosen; } catch (e) { /* egal */ }
  (layers[chosen] || layers['Fahrradkarte (CyclOSM)']).addTo(map);
  L.control.layers(layers, null, { position: 'topright' }).addTo(map);
  map.on('baselayerchange', (e) => { try { localStorage.setItem('tour-studio-layer', e.name); } catch (err) { /* egal */ } });
  let tileErrors = 0;
  for (const [name, layer] of Object.entries(layers)) {
    layer.on('tileerror', () => { if (++tileErrors === 5) log(`Kartenkacheln von „${name}“ laden nicht – oben rechts eine andere Karte wählen.`, 'warn'); });
  }
  markerLayer = L.layerGroup().addTo(map);
  map.on('dblclick', (e) => {
    if (!state.tour) return;
    const name = prompt('Name des eigenen Punkts:', 'Eigener Punkt');
    if (!name) return;
    const it = { id: `man-${Date.now()}`, source: 'manual', checked: true, name, label: '', latitude: e.latlng.lat, longitude: e.latlng.lng, desc: '', wikiText: '', wikiUrl: '', facts: [] };
    state.items.push(it);
    recalc(); render(); save(); focusItem(it.id);
    log(`Eigener Punkt „${name}“ gesetzt`, 'ok');
  });
}
function drawMap(fit) {
  if (!map) return;
  if (routeLayer) routeLayer.remove();
  markerLayer.clearLayers(); markers.clear();
  if (!state.tour) return;
  routeLayer = L.polyline(route.map((p) => [p.latitude, p.longitude]), { color: '#cf222e', weight: 4 }).addTo(map);
  if (state.sections) {
    state.sections.forEach((s, i) => {
      const pts = sectionRoute(s).map((p) => [p.latitude, p.longitude]);
      if (pts.length > 1) L.polyline(pts, { color: SECTION_COLOR[s.status], weight: 6, opacity: 0.85 })
        .bindTooltip(`Abschnitt ${i + 1}: ${SECTION_LABEL[s.status]}${s.status === 'pending' ? '' : ` · ${s.count} Funde`}`).addTo(markerLayer);
    });
  }
  for (const it of state.items) {
    if (!groupOn(it)) continue;
    const color = !it.checked ? '#9aa4ae' : (it.source === 'osm' || it.source === 'wiki') ? '#e8780c' : it.source === 'manual' ? '#1a7f37' : '#1f6feb';
    const m = L.circleMarker([it.latitude, it.longitude], { radius: it.checked ? 8 : 5, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 })
      .bindTooltip(`${it.name}${it.label ? ' · ' + it.label : ''}`).on('click', () => focusItem(it.id, true));
    m.addTo(markerLayer); markers.set(it.id, m);
  }
  if (fit) map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
}
function focusItem(id, scroll) {
  document.querySelectorAll('.card.focus').forEach((c) => c.classList.remove('focus'));
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) { card.classList.add('focus'); if (scroll) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  const it = state.items.find((i) => i.id === id);
  if (map && it) {
    if (focusCircle) focusCircle.remove();
    focusCircle = L.circle([it.latitude, it.longitude], { radius: it.radius, color: '#1f6feb', weight: 1, fillOpacity: 0.08 }).addTo(map);
    if (!scroll) map.setView([it.latitude, it.longitude], Math.max(map.getZoom(), 15));
  }
}

/* ================================================================
   Liste und Zeitplan
   ================================================================ */
const speechSeconds = (it) => Math.round(spoken(it).length / CHARS_PER_SECOND);
function spoken(it) {
  let intro = it.name;
  if (it.label) intro += `, ${it.label}`;
  if (it.distanceToRoute >= 300) intro += `, rund ${Math.round(it.distanceToRoute / 100) * 100} Meter neben der Strecke`;
  return it.desc ? `${intro}. ${it.desc}` : intro;
}
function render(fit) {
  const t = state.tour;
  $('tourInfo').textContent = t ? `${t.name} · ${fmtKm(cum[cum.length - 1])} km` : 'Keine Tour geladen';
  $('btnSearch').disabled = !t || !!job;
  $('btnExport').disabled = !t;
  $('btnClaude').disabled = !t;
  renderList();
  renderTimeline();
  renderSections();
  drawMap(fit);
}
function renderGroups() {
  const bar = $('groupBar');
  if (!state.groups) state.groups = Object.fromEntries(Object.keys(GROUPS).map((k) => [k, k !== 'weitere']));
  if (!('weitere' in state.groups)) state.groups.weitere = false;
  const counts = {};
  for (const it of state.items) if (it.group) counts[it.group] = (counts[it.group] || 0) + 1;
  const allOn = Object.keys(GROUPS).every((k) => state.groups[k] !== false);
  bar.innerHTML = `Arten: <label class="inline"><input type="checkbox" id="grpAll" ${allOn ? 'checked' : ''}> <b>alle</b></label> ` + Object.entries(GROUPS).map(([k, name]) =>
    `<label class="inline"><input type="checkbox" data-group="${k}" ${state.groups[k] !== false ? 'checked' : ''}> ${name}${counts[k] ? ` (${counts[k]})` : ''}</label>`).join(' ');
  bar.querySelectorAll('input[data-group]').forEach((cb) => cb.addEventListener('change', () => { state.groups[cb.dataset.group] = cb.checked; render(); save(); }));
  $('grpAll').addEventListener('change', (e) => { for (const k of Object.keys(GROUPS)) state.groups[k] = e.target.checked; render(); save(); });
}
function renderList() {
  renderGroups();
  const box = $('items');
  const onlyOn = $('onlyOn').checked;
  const shown = state.items.filter(groupOn);
  const on = shown.filter((i) => i.checked).length;
  $('listSummary').textContent = state.tour ? `${on} von ${shown.length} ausgewählt` + (shown.length < state.items.length ? ` (${state.items.length - shown.length} ausgeblendet)` : '') : '';
  box.innerHTML = '';
  if (!state.tour) return;
  if (!state.items.length) { box.innerHTML = '<p class="meta">Noch keine Einträge. „Sehenswürdigkeiten suchen“ oder Doppelklick auf die Karte.</p>'; return; }
  state.items.forEach((it, idx) => {
    if (onlyOn && !it.checked) return;
    if (!groupOn(it)) return;
    const card = document.createElement('div');
    card.className = `card${it.checked ? '' : ' off'}`;
    card.dataset.id = it.id;
    const src = { gpx: 'aus GPX', osm: 'OpenStreetMap', wiki: 'Wikipedia', manual: 'eigener Punkt' }[it.source];
    const sec = speechSeconds(it);
    card.innerHTML = `
      <div class="head">
        <input type="checkbox" class="chk" ${it.checked ? 'checked' : ''} title="in die Reiseführer-GPX übernehmen">
        <input type="text" class="name" value="${escapeHtml(it.name)}">
        ${it.label ? `<span class="badge" title="${escapeHtml(GROUPS[it.group] || '')}">${escapeHtml(it.label)}</span>` : ''}
        <span class="badge ${it.source}">${src}</span>
      </div>
      <div class="meta">km ${fmtKm(it.km)} · ${it.distanceToRoute} m neben der Strecke · Ansage ab km ${it.triggerKm == null ? '–' : fmtKm(it.triggerKm)} (Radius ${it.radius} m)</div>
      <div class="preview">${escapeHtml((it.desc || it.wikiText || (it.facts || []).join(' · ') || 'kein Text vorhanden').slice(0, 160))}</div>
      <div class="body">
        ${it.facts && it.facts.length ? `<div class="facts">${it.facts.map(escapeHtml).join(' · ')}</div>` : ''}
        <textarea class="desc" placeholder="Text für die Ansage (leer = nur Name wird angesagt)">${escapeHtml(it.desc)}</textarea>
        <div class="row">
          <button class="show">Auf Karte</button>
          ${it.wikiText && it.wikiText !== it.desc ? '<button class="usewiki">Wikipedia-Text übernehmen</button>' : ''}
          ${it.wikiUrl ? `<a href="${escapeHtml(it.wikiUrl)}" target="_blank" rel="noopener">Wikipedia</a>` : ''}
          ${it.osm ? `<a href="${escapeHtml(it.osm.link)}" target="_blank" rel="noopener">OSM</a>` : ''}
          ${state.items.slice(idx + 1).some(groupOn) ? '<button class="merge" title="mit dem nächsten Eintrag zu einer Ansage zusammenfassen">↓ zusammenfassen</button>' : ''}
          ${it.fullDesc ? '<button class="restore" title="gekürzten Text zurücksetzen">Original wiederherstellen</button>' : ''}
          <button class="del danger">Entfernen</button>
          <span class="count">${it.desc.length} Zeichen · ca. ${sec} s</span>
        </div>
      </div>`;
    card.querySelector('.chk').addEventListener('change', (e) => { it.checked = e.target.checked; render(); save(); });
    card.querySelector('.name').addEventListener('change', (e) => { it.name = e.target.value.trim() || it.name; renderTimeline(); drawMap(); save(); });
    const ta = card.querySelector('.desc');
    ta.addEventListener('input', () => { it.desc = ta.value; card.querySelector('.count').textContent = `${it.desc.length} Zeichen · ca. ${speechSeconds(it)} s`; renderTimeline(); save(); });
    card.querySelector('.show').addEventListener('click', () => focusItem(it.id));
    card.querySelector('.usewiki')?.addEventListener('click', () => { it.desc = it.wikiText; render(); save(); });
    card.querySelector('.restore')?.addEventListener('click', () => { it.desc = it.fullDesc; delete it.fullDesc; render(); save(); });
    card.querySelector('.del').addEventListener('click', () => { state.items = state.items.filter((x) => x !== it); render(); save(); });
    card.querySelector('.merge')?.addEventListener('click', () => mergeWithNext(idx));
    box.appendChild(card);
  });
}
// mit dem nächsten SICHTBAREN Eintrag zusammenfassen (ausgeblendete Arten überspringen)
function mergeWithNext(idx) {
  const next = state.items.slice(idx + 1).find(groupOn);
  mergeItems(state.items[idx], next);
}
function mergeItems(a, b) {
  if (!a || !b) return;
  const idx = state.items.indexOf(a);
  a.name = `${a.name}, ${b.name}`;
  a.desc = [a.desc, b.desc].filter(Boolean).join(' ');
  a.label = '';
  a.facts = [...new Set([...(a.facts || []), ...(b.facts || [])])];
  a.checked = true;
  if (a.source === 'osm' || a.source === 'wiki') a.source = 'manual';
  state.items.splice(state.items.indexOf(b), 1);
  recalc(); render(); save();
  log(`Zusammengefasst: „${a.name}“`, 'ok');
}
// Zeitplan: wann beginnt/endet jede Ansage, wo überschneiden sie sich
function timeline() {
  const speed = Math.max(3, +$('speed').value || 18) / 3.6; // m/s
  const on = state.items.filter((i) => isActive(i) && i.triggerKm != null).sort((a, b) => a.triggerKm - b.triggerKm);
  return on.map((it, i) => {
    const dur = speechSeconds(it);
    const endM = it.triggerKm + dur * speed;
    const next = on[i + 1] || null;
    return { it, dur, endM, next, clash: !!(next && next.triggerKm < endM), speed };
  });
}
// Text am Satzende so kürzen, dass die Ansage vor der nächsten endet (mind. ein Satz bleibt)
function shortenToFit(row, marginM = 30) {
  const { it, next, speed } = row;
  if (!next) return false;
  const availS = (next.triggerKm - it.triggerKm - marginM) / speed;
  const introLen = spoken({ ...it, desc: '' }).length + 2;
  const maxChars = Math.floor(availS * CHARS_PER_SECOND) - introLen;
  const sentences = (it.desc.match(/[^.!?]+[.!?]+["“”„«»]?\s*/g) || [it.desc]).map((x) => x.trim());
  let text = '';
  for (const s of sentences) {
    const cand = text ? `${text} ${s}` : s;
    if (cand.length > maxChars) break;
    text = cand;
  }
  if (!text) return false; // nicht einmal ein Satz passt
  if (text.length >= it.desc.length) return true;
  if (!it.fullDesc) it.fullDesc = it.desc;
  it.desc = text;
  log(`Gekürzt: „${it.name}“ auf ${text.length} Zeichen`, 'ok');
  return true;
}
function fixRow(row, action) {
  if (action === 'shorten' && !shortenToFit(row)) { alert('Selbst der erste Satz ist zu lang – zusammenfassen oder abwählen.'); return; }
  if (action === 'merge') { mergeItems(row.it, row.next); return; }
  if (action === 'drop') { row.next.checked = false; log(`Abgewählt: „${row.next.name}“`, 'ok'); }
  if (action === 'dropThis') { row.it.checked = false; log(`Abgewählt: „${row.it.name}“`, 'ok'); }
  recalc(); render(); save();
}
function autoFix() {
  let changed = 0;
  for (let guard = 0; guard < 200; guard++) {
    const row = timeline().find((r) => r.clash);
    if (!row) break;
    if (!shortenToFit(row)) {
      // der weiter von der Strecke entfernte der beiden fliegt raus
      const loser = (row.next.distanceToRoute || 0) >= (row.it.distanceToRoute || 0) ? row.next : row.it;
      loser.checked = false;
      log(`Abgewählt: „${loser.name}“ (kein Platz)`, 'warn');
    }
    changed++;
  }
  recalc(); render(); save();
  log(changed ? `Automatisch behoben: ${changed} Überschneidung(en)` : 'Keine Überschneidungen', 'ok');
}
function renderTimeline() {
  const pane = $('pane-timeline');
  if (!state.tour) { pane.innerHTML = ''; return; }
  const rows = timeline();
  const conflicts = rows.filter((r) => r.clash).length;
  pane.innerHTML = `
    <p class="meta">Bei ${(+$('speed').value || 18)} km/h und geschätzt ${CHARS_PER_SECOND} Zeichen pro Sekunde Sprechtempo. Eine neue Ansage bricht die laufende ab.</p>
    ${conflicts ? `<p class="warn">${conflicts} Überschneidung(en) <button id="btnAutoFix">Alle automatisch beheben</button></p>` : rows.length ? '<p style="color:var(--green)">Keine Überschneidungen.</p>' : ''}
    <table><thead><tr><th>ab km</th><th>Ansage</th><th>Dauer</th><th>endet km</th><th></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${r.clash ? 'conflict' : ''}" data-i="${i}"><td>${fmtKm(r.it.triggerKm)}</td><td class="tl-name">${escapeHtml(r.it.name)}</td><td>${r.dur} s</td><td>${fmtKm(r.endM)}</td>
      <td>${r.clash ? `<span class="warn">überschneidet sich mit „${escapeHtml(r.next.name)}“ (${Math.round(r.endM - r.next.triggerKm)} m)</span>` : ''}
        <div class="row">${r.clash ? '<button data-act="shorten">Kürzen</button><button data-act="merge">Zusammenfassen</button><button data-act="drop">Nächsten abwählen</button>' : ''}<button data-act="dropThis" title="diese Ansage aus der Auswahl nehmen">Abwählen</button></div></td></tr>`).join('')}
    </tbody></table>`;
  $('btnAutoFix')?.addEventListener('click', autoFix);
  pane.querySelectorAll('tr[data-i]').forEach((tr) => {
    const r = rows[+tr.dataset.i];
    tr.querySelectorAll('button[data-act]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); fixRow(r, b.dataset.act); }));
    tr.addEventListener('mouseenter', (e) => showTip(r.it, e));
    tr.addEventListener('mousemove', moveTip);
    tr.addEventListener('mouseleave', hideTip);
    tr.addEventListener('click', () => focusItem(r.it.id));
  });
}
// Detail-Kästchen beim Überfahren einer Zeitplan-Zeile
function showTip(it, e) {
  const tip = $('tip');
  const src = { gpx: 'aus GPX', osm: 'OpenStreetMap', wiki: 'Wikipedia', manual: 'eigener Punkt' }[it.source] || '';
  tip.innerHTML = `<b>${escapeHtml(it.name)}</b>${it.label ? ` · ${escapeHtml(it.label)}` : ''}<br>
    <span class="meta">${src} · ${it.distanceToRoute} m neben der Strecke · km ${fmtKm(it.km)} · ${it.desc.length} Zeichen${it.fullDesc ? ' (gekürzt)' : ''}</span>
    ${it.facts && it.facts.length ? `<div class="facts">${it.facts.map(escapeHtml).join(' · ')}</div>` : ''}
    <div>${escapeHtml((it.desc || 'kein Text – nur der Name wird angesagt').slice(0, 320))}${it.desc.length > 320 ? ' …' : ''}</div>`;
  tip.classList.remove('hidden');
  moveTip(e);
}
function moveTip(e) {
  const tip = $('tip');
  // bevorzugt links vom Zeitplan (über der Karte), damit die Knöpfe frei bleiben
  let x = e.clientX - tip.offsetWidth - 24;
  if (x < 10) x = Math.min(e.clientX + 16, window.innerWidth - tip.offsetWidth - 10);
  const y = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 10);
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
function hideTip() { $('tip').classList.add('hidden'); }
$('speed').addEventListener('input', renderTimeline);
$('onlyOn').addEventListener('change', renderList);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
  $('pane-list').classList.toggle('hidden', b.dataset.tab !== 'list');
  $('pane-timeline').classList.toggle('hidden', b.dataset.tab !== 'timeline');
  $('pane-sections').classList.toggle('hidden', b.dataset.tab !== 'sections');
}));

/* ================================================================
   Export
   ================================================================ */
const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function buildGpx() {
  const raw = state.tour.raw.replace(/\s*<(?:[\w-]+:)?wpt\b[^>]*?\/>/g, '').replace(/\s*<(?:[\w-]+:)?wpt\b[\s\S]*?<\/(?:[\w-]+:)?wpt>/g, '');
  const sel = state.items.filter(isActive);
  const wpts = sel.map((i) => {
    const desc = [i.label, i.desc].filter(Boolean).join('. ');
    return ` <wpt lat="${i.latitude.toFixed(6)}" lon="${i.longitude.toFixed(6)}"><name>${xmlEsc(i.name)}</name>${desc ? `<desc>${xmlEsc(desc)}</desc>` : ''}</wpt>\n`;
  }).join('');
  const m = raw.match(/\n?\s*<(?:[\w-]+:)?(?:trk|rte)\b/);
  return m ? raw.slice(0, m.index) + '\n' + wpts + raw.slice(m.index).replace(/^\n/, '') : raw.replace(/<\/(?:[\w-]+:)?gpx>/, wpts + '</gpx>');
}
$('btnExport').addEventListener('click', () => {
  const sel = state.items.filter(isActive);
  const gpx = buildGpx();
  const base = state.tour.fileName.replace(/\.gpx$/i, '').replace(/-Reisefuehrer$/, '');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' }));
  a.download = `${base}-Reisefuehrer.gpx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  log(`Reiseführer-GPX gespeichert: ${a.download} mit ${sel.length} Ansagen`, 'ok');
});
$('btnClaude').addEventListener('click', () => {
  const speed = +$('speed').value || 18;
  const lines = [
    `Bitte schreibe Reiseführer-Texte für meine Radtour „${state.tour.name}“ (${fmtKm(cum[cum.length - 1])} km, Tempo ca. ${speed} km/h).`,
    'Recherchiere die Orte (Wikipedia zuerst, dann weitere Quellen), prüfe die Fakten und gib mir eine Reiseführer-GPX zurück.',
    'Die Ansagen dürfen sich zeitlich nicht überschneiden; fasse nahe Orte bei Bedarf zusammen.',
    '',
    '## Ausgewählte Orte',
  ];
  for (const it of state.items.filter(isActive)) {
    lines.push('', `### ${it.name}${it.label ? ` (${it.label})` : ''}`);
    lines.push(`- Position: ${it.latitude.toFixed(6)}, ${it.longitude.toFixed(6)} · km ${fmtKm(it.km)} · ${it.distanceToRoute} m neben der Strecke · Ansage ab km ${it.triggerKm == null ? '–' : fmtKm(it.triggerKm)}`);
    if (it.wikiUrl) lines.push(`- Wikipedia: ${it.wikiUrl}`);
    if (it.osm) lines.push(`- OpenStreetMap: ${it.osm.link}`);
    if (it.facts && it.facts.length) lines.push(`- Fakten: ${it.facts.join('; ')}`);
    if (it.desc) lines.push(`- Bisheriger Text: ${it.desc}`);
  }
  showDialog('Für Claude kopieren', 'Text kopieren und zusammen mit der GPX-Datei in den Chat mit Claude einfügen.', lines.join('\n'));
});
function showDialog(title, hint, text) {
  $('dlgTitle').textContent = title; $('dlgHint').textContent = hint; $('dlgText').value = text;
  $('dlg').showModal();
}
$('dlgClose').addEventListener('click', () => $('dlg').close());
$('dlgCopy').addEventListener('click', async () => { await copyText($('dlgText').value); $('dlgCopy').textContent = 'Kopiert ✓'; setTimeout(() => ($('dlgCopy').textContent = 'In Zwischenablage kopieren'), 1500); });
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
$('btnLogCopy').addEventListener('click', () => copyText([...$('log').children].map((d) => d.textContent).join('\n')));
$('btnLogClear').addEventListener('click', () => { $('log').innerHTML = ''; });
$('btnLogToggle').addEventListener('click', () => { const c = $('logbar').classList.toggle('collapsed'); $('btnLogToggle').textContent = c ? 'Ausklappen' : 'Einklappen'; setTimeout(() => map && map.invalidateSize(), 50); });

/* ================================================================
   Start
   ================================================================ */
for (const [id, key, def] of [['source', 'tour-studio-source2', 'both'], ['osmServer', 'tour-studio-osmserver', 'chain']]) {
  try { $(id).value = localStorage.getItem(key) || def; } catch (e) { /* egal */ }
  $(id).addEventListener('change', () => { try { localStorage.setItem(key, $(id).value); } catch (e) { /* egal */ } });
}
initMap();
if (restore()) { prepareRoute(); recalc(); render(true); log(`Letzte Sitzung wiederhergestellt: „${state.tour.name}“`, 'dim'); }
else { render(); log('Bereit. GPX-Datei öffnen oder ins Fenster ziehen.', 'dim'); }
